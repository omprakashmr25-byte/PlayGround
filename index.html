<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Velocity Rush</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111d;font-family:Arial,sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}
#hud,#menu,#pause,#gameover{position:absolute;inset:0;pointer-events:none}#hud{display:none}.topbar{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:flex-start}.panel{background:linear-gradient(135deg,rgba(5,12,24,.88),rgba(12,24,43,.62));border:1px solid rgba(255,255,255,.13);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.22);backdrop-filter:blur(8px);color:white}.stats{display:flex;gap:18px;padding:10px 16px}.stat{min-width:62px}.stat label{display:block;color:#9eb4ca;font-size:9px;font-weight:bold;letter-spacing:1.8px}.stat b{font-size:21px;font-style:italic}.speed{width:126px;height:126px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-shadow:0 2px 8px #000}.speed:before{content:"";position:absolute;width:108px;height:108px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#ffb21a}.speed strong{font-size:35px;font-style:italic;line-height:32px}.speed span{font-size:9px;color:#b9c8d7}.pause{pointer-events:auto;border:0;width:44px;height:44px;border-radius:12px;color:white;font-size:18px;margin-left:10px;background:rgba(5,12,24,.78)}
.controls{position:absolute;left:22px;bottom:20px;display:flex;gap:12px;pointer-events:auto}.round{width:74px;height:74px;border-radius:50%;border:1px solid rgba(255,255,255,.24);color:white;background:rgba(6,14,27,.58);font-size:28px;box-shadow:inset 0 0 20px rgba(255,255,255,.04)}.rightcontrols{position:absolute;right:22px;bottom:20px;display:flex;align-items:flex-end;gap:10px;pointer-events:auto}.pedal{width:70px;height:70px;border-radius:50%;border:1px solid rgba(255,255,255,.22);color:white;font-size:10px;font-weight:bold}.brake{background:rgba(188,40,38,.72)}.gas{background:rgba(32,105,188,.78);width:82px;height:82px}.nitro{position:absolute;right:110px;bottom:20px;width:65px;height:65px;border-radius:50%;border:2px solid #66dcff;color:#fff;background:rgba(16,66,107,.78);font-size:10px;font-weight:bold}.pressed{transform:scale(.94);filter:brightness(1.4)}
#nitrobar{position:absolute;left:50%;bottom:17px;width:220px;transform:translateX(-50%);height:8px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);overflow:hidden}.nitrofill{height:100%;width:100%;background:linear-gradient(90deg,#1c77ff,#64efff);box-shadow:0 0 12px #4ecfff}
.overlay{display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(4,9,17,.72),rgba(4,9,17,.12));pointer-events:auto}.menu-card{margin-right:43%;width:min(430px,45vw);color:white}.eyebrow{color:#f6b228;font-size:12px;font-weight:bold;letter-spacing:5px}.title{font-size:64px;line-height:.86;font-style:italic;margin:12px 0 14px;text-transform:uppercase;text-shadow:0 5px 20px #000}.title em{display:block;color:#ffb226}.subtitle{color:#b9c8d6;font-size:13px;margin-bottom:25px}.start{border:0;border-radius:6px;background:linear-gradient(90deg,#ffad20,#ff7b18);color:#17120a;width:210px;height:50px;font-size:16px;font-weight:bold;letter-spacing:1px;box-shadow:0 10px 30px rgba(255,137,24,.25);pointer-events:auto}.start:active{transform:scale(.97)}
#pause,#gameover{display:none;z-index:20;background:rgba(3,8,16,.72);backdrop-filter:blur(8px)}.modal{text-align:center;color:white}.modal h2{font-size:48px;font-style:italic;margin:0 0 24px}.modal button{display:block;margin:10px auto;width:180px;height:46px;border:0;border-radius:5px;background:#ffab24;font-weight:bold}.modal button.secondary{background:rgba(255,255,255,.12);color:white}
#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);color:white;font-size:24px;font-weight:bold;font-style:italic;text-shadow:0 3px 12px #000;opacity:0;transition:.25s}.damage{animation:flash .25s}@keyframes flash{50%{box-shadow:inset 0 0 120px rgba(255,30,20,.8)}}
@media(max-width:800px){.title{font-size:48px}.menu-card{margin-right:35%}.stats{gap:8px;padding:8px 10px}.stat{min-width:48px}.stat b{font-size:17px}.speed{width:96px;height:96px}.speed:before{width:82px;height:82px}.speed strong{font-size:27px}.round{width:62px;height:62px}.pedal{width:58px;height:58px}.gas{width:68px;height:68px}.nitro{right:88px;width:58px;height:58px}.rightcontrols{right:12px}.controls{left:12px}#nitrobar{width:150px}}
@media(orientation:portrait){#rotate{display:flex}}#rotate{display:none;position:absolute;z-index:99;inset:0;background:#091422;color:white;align-items:center;justify-content:center;text-align:center;font-size:20px}
</style>
</head><body>
<canvas id="game"></canvas>
<div id="menu" class="overlay"><div class="menu-card"><div class="eyebrow">COAST HIGHWAY</div><div class="title">VELOCITY <em>RUSH</em></div><div class="subtitle">Dodge traffic · master the road · chase the horizon</div><button class="start" id="start">START RACE</button></div></div>
<div id="hud"><div class="topbar"><div class="panel stats"><div class="stat"><label>SCORE</label><b id="score">0</b></div><div class="stat"><label>DISTANCE</label><b id="distance">0.0</b></div></div><div style="display:flex"><div class="panel speed"><strong id="speed">0</strong><span>KM/H</span></div><button class="pause" id="pausebtn">Ⅱ</button></div></div><div class="controls"><button class="round" id="left">◀</button><button class="round" id="right">▶</button></div><div id="nitrobar"><div class="nitrofill" id="nitrofill"></div></div><button class="nitro" id="nitro">N₂O</button><div class="rightcontrols"><button class="pedal brake" id="brake">BRAKE</button><button class="pedal gas" id="gas">ACCEL</button></div></div>
<div id="pause"><div class="modal"><h2>PAUSED</h2><button id="resume">RESUME</button><button class="secondary" id="restart1">RESTART</button></div></div>
<div id="gameover"><div class="modal"><h2>WRECKED</h2><div id="final" style="margin-bottom:20px;color:#bcd0df"></div><button id="restart2">TRY AGAIN</button></div></div><div id="toast"></div><div id="rotate">↻<br><br>Rotate your device for the best experience</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('game');let scene,camera,renderer,car,road=[],traffic=[],particles=[];let playing=false,paused=false,gameOver=false;let speed=0,distance=0,score=0,nitro=100,health=100,last=performance.now();const keys={};const scrolling=[];let audioCtx,engineOsc,engineGain,tireOsc,tireGain;const input={left:false,right:false,gas:false,brake:false,nitro:false};
function mat(c,rough=.55,metal=.1){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}
function init(){renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;scene=new THREE.Scene();scene.background=new THREE.Color(0x83b8da);scene.fog=new THREE.Fog(0x83b8da,150,520);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,700);camera.position.set(0,7,15);
scene.add(new THREE.HemisphereLight(0xcdeaff,0x54704a,.58));const sun=new THREE.DirectionalLight(0xfff4dc,1.05);sun.position.set(-80,100,-40);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=sun.shadow.camera.bottom=-160;sun.shadow.camera.right=sun.shadow.camera.top=160;scene.add(sun);
buildWorld();buildCar();camera.lookAt(car.position);animate();}
function buildWorld(){const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),mat(0x557b43));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
for(let z=-500;z<220;z+=12){const seg=new THREE.Mesh(new THREE.BoxGeometry(20,.18,12),mat(0x30353a,.92));seg.position.set(0,.02,z);seg.receiveShadow=true;scene.add(seg);road.push(seg);for(let x of [-5,0,5]){const dash=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,3),mat(0xd9d8d0,.8));dash.position.set(x,.13,z);scene.add(dash);scrolling.push(dash)}for(let x of [-10.2,10.2]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.25,.45,12),mat(0x9aa1a3,.3,.5));rail.position.set(x,.28,z);scene.add(rail)} }
for(let z=-480;z<180;z+=18){for(let side of [-1,1]){if(Math.random()<.7){const x=side*(18+Math.random()*38);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,3,7),mat(0x6b4a2b));trunk.position.set(x,1.5,z);trunk.castShadow=true;scene.add(trunk);scrolling.push(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(2.2+Math.random(),5,8),mat(0x2f703f));crown.position.set(x,5,z);crown.castShadow=true;scene.add(crown);scrolling.push(crown)}else{const b=new THREE.Mesh(new THREE.BoxGeometry(7,8,9),mat([0xd3c5a2,0x9eb1b8,0xbfa68f][Math.floor(Math.random()*3)]));b.position.set(side*(24+Math.random()*25),4,z);b.castShadow=true;scene.add(b);scrolling.push(b);const roof=new THREE.Mesh(new THREE.BoxGeometry(7.5,.5,9.5),mat(0x6d4d3d));roof.position.set(b.position.x,8.25,z);scene.add(roof);scrolling.push(roof)}}if(z%54===-36){for(let side of [-1,1]){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,7,8),mat(0x3f4b55));pole.position.set(side*13,3.5,z);scene.add(pole);scrolling.push(pole);const lamp=new THREE.Mesh(new THREE.BoxGeometry(1.4,.18,.35),mat(0xfff1b4,.2));lamp.position.set(side*12.6,7,z);scene.add(lamp);scrolling.push(lamp)}}}
const mountainMat=new THREE.MeshStandardMaterial({color:0x71889a,roughness:1});for(let i=0;i<16;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(35+Math.random()*30,55+Math.random()*35,5),mountainMat);m.position.set((i-8)*42,-5,-430-Math.random()*100);scene.add(m)}scrolling.forEach(o=>o.userData.startZ=o.position.z)}
function buildCar(){car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(3.2,.65,6.4),mat(0xe52e24,.25,.55));body.position.y=.95;body.castShadow=true;car.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(3.1,.45,2),mat(0xf23930,.25,.55));hood.position.set(0,1.25,-2);hood.castShadow=true;car.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.5,.8,2.7),mat(0x172331,.12,.25));cabin.position.set(0,1.65,-.1);cabin.geometry.translate(0,0,.15);cabin.castShadow=true;car.add(cabin);const roof=new THREE.Mesh(new THREE.BoxGeometry(2.15,.12,1.7),mat(0xe52e24,.25,.55));roof.position.set(0,2.15,-.05);car.add(roof);for(let x of [-1.61,1.61])for(let z of [-2,2]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.38,20),mat(0x111318,.7));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.65,z);wheel.castShadow=true;wheel.name='wheel';car.add(wheel);const rim=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.4,12),mat(0xc8cdd0,.2,.8));rim.rotation.z=Math.PI/2;rim.position.copy(wheel.position);car.add(rim)}for(let x of [-.9,.9]){const hl=new THREE.Mesh(new THREE.BoxGeometry(.55,.18,.08),mat(0xfff4cc,.05,.1));hl.position.set(x,1.05,-3.23);car.add(hl);const light=new THREE.PointLight(0xffe7b0,1.5,28);light.position.set(x,1.05,-3.5);car.add(light)}const rear=new THREE.Mesh(new THREE.BoxGeometry(2.2,.25,.08),mat(0x8b0808,.2,.3));rear.position.set(0,1.05,3.22);car.add(rear);const spoiler=new THREE.Mesh(new THREE.BoxGeometry(3,.12,.5),mat(0x16191d,.3,.6));spoiler.position.set(0,1.65,2.75);car.add(spoiler);car.position.set(0,.1,5);scene.add(car);}
function spawnTraffic(){if(traffic.length>12)return;const lane=[-7.5,-2.5,2.5,7.5][Math.floor(Math.random()*4)];const g=new THREE.Group();const c=[0x2679b8,0xf1c84a,0xececec,0x26282d,0x4ba46c][Math.floor(Math.random()*5)];const body=new THREE.Mesh(new THREE.BoxGeometry(2.8,.75,5),mat(c,.35,.25));body.position.y=.8;body.castShadow=true;g.add(body);const cab=new THREE.Mesh(new THREE.BoxGeometry(2.3,.65,2.3),mat(0x172331,.15,.2));cab.position.set(0,1.42,.2);g.add(cab);g.position.set(lane,.05,-170-Math.random()*80);g.userData={speed:35+Math.random()*28};scene.add(g);traffic.push(g)}
function reset(){for(const t of traffic)scene.remove(t);traffic=[];distance=0;score=0;speed=0;nitro=100;health=100;gameOver=false;car.position.set(0,.1,5);road.forEach((r,i)=>r.position.z=-500+i*12);scrolling.forEach(o=>o.position.z=o.userData.startZ);document.body.classList.remove('damage');}
function audioStart(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();engineOsc=audioCtx.createOscillator();engineGain=audioCtx.createGain();engineOsc.type='sawtooth';engineGain.gain.value=.018;engineOsc.connect(engineGain);engineGain.connect(audioCtx.destination);engineOsc.start();tireOsc=audioCtx.createOscillator();tireOsc.type='triangle';tireOsc.frequency.value=540;tireGain=audioCtx.createGain();tireGain.gain.value=0;tireOsc.connect(tireGain);tireGain.connect(audioCtx.destination);tireOsc.start()}audioCtx.resume()}
function playCrash(){if(!audioCtx)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='square';osc.frequency.setValueAtTime(130,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(38,audioCtx.currentTime+.22);gain.gain.setValueAtTime(.12,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.25);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.26)}
function start(){audioStart();if(innerWidth<900&&document.fullscreenEnabled)document.documentElement.requestFullscreen().catch(()=>{});if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});reset();playing=true;paused=false;document.getElementById('menu').style.display='none';document.getElementById('gameover').style.display='none';document.getElementById('pause').style.display='none';document.getElementById('hud').style.display='block';}
function togglePause(){if(!playing||gameOver)return;paused=!paused;document.getElementById('pause').style.display=paused?'flex':'none'}
function endGame(){gameOver=true;playing=false;document.getElementById('hud').style.display='none';document.getElementById('gameover').style.display='flex';document.getElementById('final').textContent=`DISTANCE ${(distance/1000).toFixed(2)} KM · SCORE ${Math.floor(score)}`}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,700)}
function bind(id,key){const e=document.getElementById(id);for(const type of ['pointerdown','pointerenter'])e.addEventListener(type,v=>{if(type==='pointerenter'&&v.buttons===0)return;v.preventDefault();input[key]=true;e.classList.add('pressed')});for(const type of ['pointerup','pointerleave','pointercancel'])e.addEventListener(type,()=>{input[key]=false;e.classList.remove('pressed')})}
bind('left','left');bind('right','right');bind('brake','brake');bind('gas','gas');bind('nitro','nitro');
document.getElementById('start').onclick=start;document.getElementById('pausebtn').onclick=togglePause;document.getElementById('resume').onclick=togglePause;document.getElementById('restart1').onclick=start;document.getElementById('restart2').onclick=start;
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='Escape')togglePause()});window.addEventListener('keyup',e=>keys[e.key]=false);
function animate(now=performance.now()){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(!paused&&!gameOver){update(dt)}renderer.render(scene,camera)}
function update(dt){const left=input.left||keys.ArrowLeft||keys.a,right=input.right||keys.ArrowRight||keys.d,brake=input.brake||keys.ArrowDown||keys.s,gas=input.gas||keys.ArrowUp||keys.w,nitroOn=input.nitro||keys.Shift;let accel=gas?42:0;if(brake)speed-=72*dt;if(nitroOn&&nitro>0&&speed>20){speed+=55*dt;nitro-=26*dt;scene.fog.color.setHex(0x769fbe)}else{nitro=Math.min(100,nitro+3.5*dt);scene.fog.color.setHex(0x83b8da)}speed+=accel*dt;speed-=(!gas?8:3)*dt;speed=Math.max(0,Math.min(speed,nitroOn&&nitro>0?220:175));if(audioCtx){engineOsc.frequency.setTargetAtTime(55+speed*2.1,audioCtx.currentTime,.08);engineGain.gain.setTargetAtTime(.008+speed/14000,audioCtx.currentTime,.1);tireGain.gain.setTargetAtTime(speed>75&&(left||right)? .045:0,audioCtx.currentTime,.06)}const steer=(left?-1:0)+(right?1:0);const steerPower=(0.25+speed/180)*steer*dt*18;car.position.x+=steerPower;car.position.x=Math.max(-8.6,Math.min(8.6,car.position.x));car.rotation.z+=(steerPower*-0.16-car.rotation.z)*dt*7;car.rotation.y+=((-steer*.035)-car.rotation.y)*dt*6;car.rotation.x+=(speed>150?-.015:0-car.rotation.x)*dt*5;
const roadSpeed=speed*.42*dt;for(const r of road){r.position.z+=roadSpeed;if(r.position.z>15)r.position.z-=504}for(const o of scrolling){o.position.z+=roadSpeed;if(o.position.z>20)o.position.z-=660}for(const c of [...traffic]){c.position.z+=roadSpeed+(c.userData.speed*.28*dt);if(c.position.z>30){scene.remove(c);traffic.splice(traffic.indexOf(c),1);score+=150;toast('OVERTAKE +150')}if(Math.abs(c.position.z-car.position.z)<3.8&&Math.abs(c.position.x-car.position.x)<2.5){scene.remove(c);traffic.splice(traffic.indexOf(c),1);speed*=.35;health-=35;playCrash();document.body.classList.add('damage');setTimeout(()=>document.body.classList.remove('damage'),300);toast('CRASH');if(health<=0)endGame();}}
if(Math.random()<dt*.9)spawnTraffic();distance+=speed*dt/3.6;score+=speed*dt*.18;camera.position.x+=(car.position.x*.48-camera.position.x)*dt*4;camera.position.y+=(7-camera.position.y)*dt*3;camera.position.z+=(15-camera.position.z)*dt*4;camera.lookAt(car.position.x*.28,1.2,-8);
car.traverse(o=>{if(o.name==='wheel')o.rotation.x-=speed*dt*.1});document.getElementById('speed').textContent=Math.floor(speed);document.getElementById('distance').textContent=(distance/1000).toFixed(1)+' KM';document.getElementById('score').textContent=Math.floor(score);document.getElementById('nitrofill').style.width=nitro+'%';}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});init();
</script></body></html>
